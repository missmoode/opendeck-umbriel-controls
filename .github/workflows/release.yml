name: Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a GitHub App or PAT token lets the release PR trigger CI.
          # GITHUB_TOKEN-created PRs do not start ordinary pull_request workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
  build-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Artifact uploads are already compressed; only pass along the native binary.
      - run: ./build.sh --bundle
      - uses: actions/upload-artifact@v7
        with:
          name: umbriel-controls-${{ matrix.arch }}
          path: dist/dev.moode.umbriel-controls.sdPlugin/umbriel-controls-${{ matrix.target }}
          if-no-files-found: error
  attach-assets:
    needs: [release, build-assets]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: umbriel-controls-*
          path: dist/binaries
          merge-multiple: true
      - name: Assemble universal plugin archive
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(jq -er '.Version' assets/manifest.json)" = "$version"

          bundle="dist/dev.moode.umbriel-controls.sdPlugin"
          mkdir -p "$bundle"
          cp -a assets/. "$bundle/"
          install -Dm644 LICENSE "$bundle/LICENSE"
          install -Dm644 crates/umbriel-ipc/LICENSE "$bundle/crates/umbriel-ipc/LICENSE"

          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            binary="$(jq -er --arg target "$target" '.CodePaths[$target]' assets/manifest.json)"
            install -m755 "dist/binaries/$binary" "$bundle/$binary"
          done
          fallback="$(jq -er '.CodePathLin' assets/manifest.json)"
          test -x "$bundle/$fallback"

          archive="umbriel-controls-${version}.streamDeckPlugin"
          (cd dist && zip -qr "$archive" "dev.moode.umbriel-controls.sdPlugin")
          unzip -t "dist/$archive"
      - name: Attach archive and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "dist/umbriel-controls-${version}.streamDeckPlugin" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
