name: Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional: a GitHub App or PAT token lets the release PR trigger CI.
          # GITHUB_TOKEN-created PRs do not start ordinary pull_request workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
  build-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./build.sh --archive
      - run: unzip -t dist/*.streamDeckPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: umbriel-controls-${{ matrix.arch }}
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
  attach-assets:
    needs: [release, build-assets]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: umbriel-controls-*
          path: dist
          merge-multiple: true
      - name: Attach archives and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for arch in x86_64 aarch64; do
            test -f "dist/umbriel-controls-${version}-${arch}-linux.streamDeckPlugin"
          done
          gh release upload "$RELEASE_TAG" \
            "dist/umbriel-controls-${version}-x86_64-linux.streamDeckPlugin" \
            "dist/umbriel-controls-${version}-aarch64-linux.streamDeckPlugin" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
