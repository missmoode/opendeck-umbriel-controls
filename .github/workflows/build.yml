name: Check and build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  preflight:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: ./build.sh --archive
      - run: unzip -t dist/*.streamDeckPlugin
      - name: Check archived licence notices
        run: |
          for archive in dist/*.streamDeckPlugin; do
            unzip -Z1 "$archive" | grep -Fx 'dev.moode.umbriel-controls.sdPlugin/LICENSE'
            unzip -Z1 "$archive" | grep -Fx 'dev.moode.umbriel-controls.sdPlugin/crates/umbriel-ipc/LICENSE'
          done
  nix:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check
      - run: nix build .#packages.x86_64-linux.default --no-link
