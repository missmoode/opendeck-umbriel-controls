version: 2
multi-ecosystem-groups:
  dependency-updates:
    schedule:
      interval: "weekly"
      day: "saturday"
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-updates"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-updates"
  - package-ecosystem: "nix"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependency-updates"
