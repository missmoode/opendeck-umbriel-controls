<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <script src="palette-field.js"></script>
    <script src="global-settings.js"></script>
    <link href="pi.css" rel="stylesheet" />
  </head>

  <body>
    <div class="uc-inspector-grid">
      <section
        class="uc-inspector-section uc-config"
        aria-labelledby="uc-config-heading"
      >
        <h2 id="uc-config-heading" class="uc-inspector-heading">
          Configuration
        </h2>
        <sdpi-item label="Output">
          <sdpi-select
            id="workspace-output"
            placeholder="Choose an output"
          ></sdpi-select>
        </sdpi-item>

        <sdpi-item label="Workspace">
          <sdpi-select
            id="workspace-position"
            placeholder="Choose a workspace"
          ></sdpi-select>
        </sdpi-item>

        <sdpi-item label="Inventory">
          <sdpi-button id="refresh-workspaces"
            >Refresh available workspaces</sdpi-button
          >
        </sdpi-item>

        <sdpi-item label="Hold Action">
          <sdpi-select setting="hold_action" default="move_window">
            <option value="disabled">Disabled</option>
            <option value="move_window">Move window and follow</option>
            <option value="move_window_silent">Move window silently</option>
            <option value="move_column">Move entire column</option>
          </sdpi-select>
        </sdpi-item>
      </section>
      <section
        class="uc-inspector-section uc-appearance"
        aria-labelledby="uc-appearance-heading"
      >
        <h2 id="uc-appearance-heading" class="uc-inspector-heading">
          Appearance
        </h2>
        <sdpi-item label="Show badge">
          <sdpi-checkbox
            setting="show_badge"
            label="Display badge"
            default="true"
          >
          </sdpi-checkbox>
        </sdpi-item>

        <sdpi-item id="label-field" label="Badge text">
          <sdpi-textfield
            setting="label"
            placeholder="Use workspace identifier"
            maxlength="24"
          >
          </sdpi-textfield>
        </sdpi-item>

        <uc-palette></uc-palette>
      </section>
    </div>
    <script>
      const { streamDeckClient } = SDPIComponents;

      const badgeCheckbox = document.querySelector(
        'sdpi-checkbox[setting="show_badge"]',
      );
      const badgeLabelField = document.getElementById("label-field");

      function updateBadgeVisibility(showBadge) {
        badgeLabelField.style.display = showBadge ? "" : "none";
      }

      badgeCheckbox.addEventListener("valuechange", () => {
        updateBadgeVisibility(badgeCheckbox.value);
      });

      streamDeckClient.getSettings().then(({ settings }) => {
        updateBadgeVisibility(settings.show_badge ?? true);
      });
    </script>
    <uc-global-settings></uc-global-settings>
    <script src="workspace-target.js"></script>
  </body>
</html>
