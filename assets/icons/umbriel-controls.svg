
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="16 16 228 228">
  <title>Umbriel Controls</title>
  <defs>
    <linearGradient id="edge-shine"
                    x1="242" y1="110" x2="94" y2="236"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF59B" stop-opacity="0"/>
      <stop offset="0.13" stop-color="#FFF59B" stop-opacity="0.35"/>
      <stop offset="0.34" stop-color="#FFF59B" stop-opacity="0.98"/>
      <stop offset="0.60" stop-color="#FFF59B" stop-opacity="0.83"/>
      <stop offset="0.83" stop-color="#FFF59B" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#FFF59B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge-shine-top-left"
                    x1="28" y1="104" x2="113" y2="30"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF59B" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FFF59B" stop-opacity="0.12"/>
      <stop offset="0.40" stop-color="#FFF59B" stop-opacity="0.40"/>
      <stop offset="0.64" stop-color="#FFF59B" stop-opacity="0.25"/>
      <stop offset="0.85" stop-color="#FFF59B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFF59B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge-shine-top-left-outer"
                    x1="25.5" y1="92" x2="97" y2="27.5"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE5" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#FFFDE5" stop-opacity="0.05"/>
      <stop offset="0.46" stop-color="#FFFDE5" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#FFFDE5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFDE5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge-shine-top-right"
                    x1="203" y1="30" x2="230" y2="57"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE5" stop-opacity="0"/>
      <stop offset="0.23" stop-color="#FFFDE5" stop-opacity="0.07"/>
      <stop offset="0.54" stop-color="#FFFDE5" stop-opacity="0.22"/>
      <stop offset="0.80" stop-color="#FFFDE5" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFDE5" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge-shine-bottom-left"
                    x1="27" y1="199" x2="55" y2="231"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDE5" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#FFFDE5" stop-opacity="0.07"/>
      <stop offset="0.58" stop-color="#FFFDE5" stop-opacity="0.19"/>
      <stop offset="0.85" stop-color="#FFFDE5" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFDE5" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="channel-clip">
      <rect x="24" y="26" width="207" height="205" rx="38"/>
    </clipPath>

    <!-- Diffused light within the plastic sidewall -->
    <filter id="edge-diffusion"
            x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>

    <!-- Softer central concentration without a hard inner ridge -->
    <filter id="edge-gather-soft"
            x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.85"/>
    </filter>
  </defs>

  <!-- Physical key shell and recessed display -->
  <rect id="shell" x="20" y="22" width="220" height="218"
        rx="42" fill="#110F3D"/>
  <rect id="channel" x="24" y="26" width="207" height="205"
        rx="38" fill="#696AC4"/>

  <!-- Ink-blue visible through the bevel, flowing back into the shell -->
  <path id="bevel-depth"
        d="M53.45 230.03
           A38 38 0 0 1 24 193
           V64
           A38 38 0 0 1 62 26
           H193
           A38 38 0 0 1 230.03 55.45
           C228.14 47.22 217 31 193 31
           H62
           A33 33 0 0 0 29 64
           V193
           C29 211 40.5 227.04 53.45 230.03
           Z"
        fill="#110F3D" fill-opacity="0.30"/>

  <rect id="display" x="35" y="38" width="196" height="193"
        rx="38" fill="#A4A7FB"/>

  <!-- Refracted yellow light gathering near the outer plastic rim -->
  <g clip-path="url(#channel-clip)">

    <!-- Broad, diffuse light scattered through the bevel -->
    <path id="edge-glow"
          d="M228.8 110 V193
             A35.8 35.8 0 0 1 193 228.8 H60"
          fill="none" stroke="url(#edge-shine)"
          stroke-width="11" stroke-opacity="0.33"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#edge-diffusion)"/>

    <!-- Wider concentration of refracted light -->
    <path id="edge-highlight"
          d="M229.1 116 V193
             A36.1 36.1 0 0 1 193 229.1 H82"
          fill="none" stroke="url(#edge-shine)"
          stroke-width="5.8" stroke-opacity="0.65"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#edge-gather-soft)"/>

    <!-- Fine glint at the outer edge of the bevel -->
    <path id="edge-highlight-outer"
          d="M230.2 133 V193
             A37.2 37.2 0 0 1 193 230.2 H98"
          fill="none" stroke="url(#edge-shine)"
          stroke-width="1.35" stroke-opacity="0.49"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Very subtle outer top-left reflection -->
  <path id="edge-highlight-top-left-outer"
        d="M25.5 92 V61 C25.5 42.8 42 27.5 60 27.5 H95"
        fill="none" stroke="url(#edge-shine-top-left-outer)"
        stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main upper-left reflection -->
  <path id="edge-glow-top-left"
        d="M28 104 V65 C28 45.5 44 30 64 30 H113"
        fill="none" stroke="url(#edge-shine-top-left)"
        stroke-width="6" stroke-opacity="0.10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path id="edge-highlight-top-left"
        d="M28 104 V65 C28 45.5 44 30 64 30 H113"
        fill="none" stroke="url(#edge-shine-top-left)"
        stroke-width="2.75"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle glints near the two bevel transitions -->
  <path id="edge-highlight-top-right"
        d="M202 29.5 C217 30.5 228 41.5 229 55"
        fill="none" stroke="url(#edge-shine-top-right)"
        stroke-width="2.5" stroke-linecap="round"/>
  <path id="edge-highlight-bottom-left"
        d="M27.5 201 C28.5 215 39 226 53 229"
        fill="none" stroke="url(#edge-shine-bottom-left)"
        stroke-width="2.5" stroke-linecap="round"/>

  <!-- Closed eyes and smile -->
  <g id="face"
     transform="translate(6 -3) translate(124 140) scale(1.35) translate(-124 -140)"
     fill="none" stroke="#110F3D"
     stroke-width="11" stroke-linecap="round">
    <path id="left-eye" d="M82 122 Q96 110 110 122"
          stroke-width="14"/>
    <path id="right-eye" d="M139 122 Q153 110 167 122"
          stroke-width="14"/>
    <path id="mouth" d="M103 157 Q124.5 168 146 157"/>
  </g>
</svg>
