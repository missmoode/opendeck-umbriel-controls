
<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 128 128"
     fill="none">

  <g stroke="#141419"
     stroke-width="4.5"
     stroke-linejoin="round">

    <!-- Back window: muted violet -->
    <rect x="12" y="20"
          width="72" height="53"
          rx="10"
          fill="color-mix(in srgb, #B6A4EA, black 60%)"/>

    <!-- Middle window: warm gold -->
    <rect x="55" y="28"
          width="62" height="43"
          rx="10"
          fill="#F5C96B"/>

    <!-- Front window: Umbriel-inspired blue -->
    <rect x="17" y="63"
          width="80" height="50"
          rx="10"
          fill="#7AA3FF"/>

  </g>
</svg>
